<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumänisch für Marie 🇷🇴</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .header {
            background: white;
            padding: 15px 30px;
            border-radius: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }
        .stars {
            font-size: 24px;
            font-weight: bold;
            color: #ff9f1c;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 { color: #ff4d6d; margin-top: 0; font-size: 28px; }
        .btn {
            background: #4cc9f0;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            box-shadow: 0 5px 0 #3a86ff;
            transition: transform 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #3a86ff; }
        .btn-green { background: #06d6a0; box-shadow: 0 5px 0 #049a73; }
        .btn-purple { background: #9b5de5; box-shadow: 0 5px 0 #6a359c; }
        .emoji { font-size: 80px; margin: 15px 0; }
        .word-ro { font-size: 36px; font-weight: bold; color: #2b2d42; margin: 10px 0; }
        .word-de { font-size: 20px; color: #8d99ae; margin-bottom: 20px; }
        .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .quiz-option {
            background: #f8f9fa;
            border: 3px solid #dee2e6;
            border-radius: 20px;
            padding: 15px;
            font-size: 40px;
            cursor: pointer;
        }
        .quiz-option:hover { border-color: #4cc9f0; background: #e0fbfc; }
        .feedback { font-size: 22px; font-weight: bold; margin-top: 15px; min-height: 30px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div><strong>Hallo Marie! 👋</strong></div>
        <div class="stars">⭐ <span id="star-count">0</span></div>
    </div>

    <!-- Startbildschirm -->
    <div id="menu-screen" class="card">
        <h1>Rumänisch lernen 🇷🇴</h1>
        <p>Wähle ein Thema aus:</p>
        <button class="btn" onclick="startCategory('tiere')">🐶 Tiere (Animale)</button>
        <button class="btn btn-green" onclick="startCategory('farben')">🎨 Farben (Culori)</button>
        <button class="btn btn-purple" onclick="startCategory('hallo')">👋 Begrüßung (Salut)</button>
    </div>

    <!-- Lern- & Quiz-Bildschirm -->
    <div id="game-screen" class="card hidden">
        <button onclick="showMenu()" style="float:left; border:none; background:none; font-size:18px; cursor:pointer;">⬅️ Zurück</button>
        <div style="clear:both;"></div>

        <!-- Lernmodus -->
        <div id="learn-box">
            <div class="emoji" id="learn-emoji">🐶</div>
            <div class="word-ro" id="learn-ro">Câine</div>
            <div class="word-de" id="learn-de">Der Hund</div>
            <button class="btn" onclick="speakCurrent()">🔊 Anhören</button>
            <button class="btn btn-green" onclick="nextWord()">Weiter ➡️</button>
        </div>

        <!-- Quizmodus -->
        <div id="quiz-box" class="hidden">
            <h2>Was heißt:</h2>
            <div class="word-ro" id="quiz-word">Câine</div>
            <button class="btn" onclick="speakQuiz()" style="padding:10px; font-size:16px; width:auto;">🔊 Nochmal hören</button>
            <div class="quiz-grid" id="quiz-options"></div>
            <div class="feedback" id="quiz-feedback"></div>
        </div>
    </div>

    <script>
        const data = {
            tiere: [
                { ro: "Câine", de: "Der Hund", emoji: "🐶" },
                { ro: "Pisică", de: "Die Katze", emoji: "🐱" },
                { ro: "Cal", de: "Das Pferd", emoji: "🐴" },
                { ro: "Iepure", de: "Der Hase", emoji: "🐰" }
            ],
            farben: [
                { ro: "Roșu", de: "Rot", emoji: "🔴" },
                { ro: "Albastru", de: "Blau", emoji: "🔵" },
                { ro: "Galben", de: "Gelb", emoji: "🟡" },
                { ro: "Verde", de: "Grün", emoji: "🟢" }
            ],
            hallo: [
                { ro: "Bună!", de: "Hallo!", emoji: "👋" },
                { ro: "Mulțumesc", de: "Danke", emoji: "🙏" },
                { ro: "Te rog", de: "Bitte", emoji: "😊" },
                { ro: "Pa-pa!", de: "Tschüss!", emoji: "✌️" }
            ]
        };

        let currentList = [];
        let currentIndex = 0;
        let stars = 0;
        let quizTarget = null;

        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ro-RO';
            msg.rate = 0.85;
            window.speechSynthesis.speak(msg);
        }

        function startCategory(cat) {
            currentList = data[cat];
            currentIndex = 0;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            showLearnWord();
        }

        function showLearnWord() {
            document.getElementById('learn-box').classList.remove('hidden');
            document.getElementById('quiz-box').classList.add('hidden');
            const item = currentList[currentIndex];
            document.getElementById('learn-emoji').innerText = item.emoji;
            document.getElementById('learn-ro').innerText = item.ro;
            document.getElementById('learn-de').innerText = item.de;
            speak(item.ro);
        }

        function speakCurrent() {
            speak(currentList[currentIndex].ro);
        }

        function nextWord() {
            currentIndex++;
            if (currentIndex < currentList.length) {
                showLearnWord();
            } else {
                startQuiz();
            }
        }

        function startQuiz() {
            document.getElementById('learn-box').classList.add('hidden');
            document.getElementById('quiz-box').classList.remove('hidden');
            document.getElementById('quiz-feedback').innerText = "";
            
            quizTarget = currentList[Math.floor(Math.random() * currentList.length)];
            document.getElementById('quiz-word').innerText = quizTarget.ro;
            speak(quizTarget.ro);

            const grid = document.getElementById('quiz-options');
            grid.innerHTML = "";
            const shuffled = [...currentList].sort(() => Math.random() - 0.5);

            shuffled.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.innerText = item.emoji;
                btn.onclick = () => checkAnswer(item);
                grid.appendChild(btn);
            });
        }

        function speakQuiz() {
            if (quizTarget) speak(quizTarget.ro);
        }

        function checkAnswer(selected) {
            const fb = document.getElementById('quiz-feedback');
            if (selected.ro === quizTarget.ro) {
                fb.style.color = "#06d6a0";
                fb.innerText = "Super Marie! +1 ⭐";
                stars++;
                document.getElementById('star-count').innerText = stars;
                setTimeout(startQuiz, 1200);
            } else {
                fb.style.color = "#ff4d6d";
                fb.innerText = "Fast! Versuch es nochmal 💪";
                speak(quizTarget.ro);
            }
        }

        function showMenu() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
